; Calidad gráfica por niveles (sg.*): solo lo que cambia respecto a BaseScalability.ini del motor (UE 5.6); el resto de
; claves de cada sección se hereda. Niveles: 0 = Bajo, 1 = Medio, 2 = Alto, 3 = Épico, Cine = capturas.
; Objetivo: que el juego vaya fluido en PCs modestos (#577). Medidas y criterio en Docs/Rendimiento_GPU_2026-10-02.md
; («Niveles de calidad»).
;
; Aquí solo pueden ir cvars marcadas ECVF_Scalability: el motor ignora las demás (con un ensure). Por eso el ray tracing
; (r.RayTracing.Enable, apagado en Bajo, Medio y Alto de iluminación global, #562) lo fija UTN_RayTracingQualitySubsystem.
;
; Toda cvar que un nivel cambia la fijan todos los niveles de su grupo: al subir de nivel no se hereda el valor del anterior
; (por ejemplo, r.Shadow.Virtual.Enable=0 de Medio se quedaría puesto al pasar a Épico si Épico no lo devolviese a 1).
;
; r.Shadow.Virtual.Enable ya no está en DefaultEngine.ini: allí tenía prioridad de ajuste de proyecto y la escalabilidad no
; podía cambiarlo.

; ── Sombras ─────────────────────────────────────────────────────────────────────────────────────────────────────────────
; Bajo y Medio: mapas de sombras clásicos en cascada (CSM), sin sombras virtuales (VSM). La geometría del juego es casi
; toda sin Nanite (ProcMesh e ISM creados en ejecución) y VSM es caro sin Nanite. El motor, en Bajo, quitaba todas las
; sombras dinámicas (r.ShadowQuality=0) y la tortuga perdía la sombra bajo los pies al saltar.

[ShadowQuality@0]
r.Shadow.Virtual.Enable=0
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxCSMResolution=1024
; Distancia corta: con una sola cascada de 1024, unos 60-70 m (con la distancia de sombra de serie de la luz direccional).
r.Shadow.DistanceScale=0.35

[ShadowQuality@1]
r.Shadow.Virtual.Enable=0
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.MaxCSMResolution=2048
r.Shadow.DistanceScale=0.6

; Alto: sombras virtuales con la mitad de rayos de suavizado de la luz direccional que el Alto del motor (8 → 4).
[ShadowQuality@2]
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.SMRT.RayCountDirectional=4

[ShadowQuality@3]
r.Shadow.Virtual.Enable=1

[ShadowQuality@Cine]
r.Shadow.Virtual.Enable=1
