; Mapas de juego explícitos: destinos de viaje de MP_GameInstance, TN_HQGameMode::BeginMatchTravel y TN_RunGameMode.
; /Game/Maps ya no se cocina entero: los mapas de prueba no van al .pak. LVL_Demo01 es el mapa del modo único (el terreno
; de Scripts/terrain_volumes aún no se empaqueta).
; /Game/Blueprints se sigue cocinando entero porque el código carga BP por ruta blanda (LoadClass/FSoftObjectPath).
+MapsToCook=(FilePath="/Game/Maps/Lobby/LVL_Menu")
+MapsToCook=(FilePath="/Game/Maps/Lobby/LVL_HQ")
+MapsToCook=(FilePath="/Game/Maps/Lobby/LVL_Lobby")
+MapsToCook=(FilePath="/Game/Maps/Run/LVL_Demo01")
+MapsToCook=(FilePath="/Game/Maps/LVL_Transition")
; Assets retirados (Docs/Limpieza-2026-09-29.md): se conservan en el editor, fuera del .pak.
+DirectoriesToNeverCook=(Path="/Game/_Deprecado")
+DirectoriesToAlwaysCook=(Path="/Game/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Input")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints/Gameplay/Controls")
+DirectoriesToAlwaysCook=(Path="/Game/Blueprints")
+DirectoriesToAlwaysCook=(Path="/Game/ProcMap")
; Sonidos de acción de la tortuga que pone de serie el constructor de C++ (TN_TurtleActionSfx.cpp; Docs/Sonido_Tortuga.md).
+DirectoriesToAlwaysCook=(Path="/Game/Audio/EffectSounds")
; Carpetas que el codigo carga por ruta desde clases nativas sin asset propio (TN_TurtleAnimInstance, TN_CosmeticLook,
; TN_TurtleFaceComponent, el material de color de vertice de los kits): nada las referencia desde un mapa. Pesan < 5 MB.
; El test Tortunabo.Cook.StringPathsAreCooked falla si una ruta literal de Source/ queda fuera de estas listas.
+DirectoriesToAlwaysCook=(Path="/Game/Cosmetics")
+DirectoriesToAlwaysCook=(Path="/Game/Animations")
+DirectoriesToAlwaysCook=(Path="/Game/Meshses")
; Catalogos de arte (DA_Arte_*) y las mallas finales que nombran: todas las maquinas resuelven lo mismo (Docs/Arte_Assets.md).
+DirectoriesToAlwaysCook=(Path="/Game/Art")
; Localizacion (Docs/Localizacion.md). "All" empaqueta los datos de todas las culturas: hacen falta ru, pl, tr y pt-BR, que no
; van en EFIGSCJK. Cada idioma nuevo tambien se anade aqui (y en la lista de idiomas de mas abajo).
InternationalizationPreset=All
