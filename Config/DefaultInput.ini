; Mandos que no son de Xbox (#743, Docs/Mandos.md): los lee el lector DirectInput del juego (TN_GamepadDevice) en el editor y
; sin Steam Input; los de Xbox siguen por XInput. Cada perfil traduce los botones (por número de DirectInput, desde 0), los
; ejes y la cruceta a las teclas Gamepad_* de serie, así valen los IMC_* sin tocarlos. Gana el primero que encaja por
; VendorID/ProductID (hexadecimal); el último, sin IDs, vale para cualquier mando. Para hacer uno nuevo: TN.Input.PadDebug 1.
; PlayStation (DualShock 4, DualSense y DualSense Edge): 0 cuadrado, 1 cruz, 2 círculo, 3 triángulo, 4 L1, 5 R1, 6-7 L2/R2
; digitales (van por los ejes RX/RY), 8 Share/Create, 9 Options, 10 L3, 11 R3, 12 PS, 13 panel táctil, 14 silencio.
; Switch Pro: 0 B, 1 A, 2 Y, 3 X, 4 L, 5 R, 6 ZL, 7 ZR, 8 −, 9 +, 10 stick izquierdo, 11 stick derecho, 12 Home, 13 captura.
